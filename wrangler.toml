# ⚠️ 这是提交到仓库的模板版本，所有值都是占位符。
# 本机实际部署用的 wrangler.toml 在上一级目录（源文件夹）里，含真实域名与 KV 命名空间 id，
# 那个目录不参与上传，所以真实配置不会进仓库。
# 克隆本仓库后，把下面的占位符替换成你自己的值即可部署。

name = "my-email-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DOMAIN = "example.com"
ADMIN_ACCOUNT = "admin"
# 用 `npx web-push generate-vapid-keys` 生成一对，这里填公钥；
# 私钥不要写进文件，用 `npx wrangler secret put VAPID_PRIVATE_KEY` 设置。
VAPID_PUBLIC_KEY = "你的 VAPID 公钥"

[[kv_namespaces]]
binding = "EMAIL"
id = "你的 EMAIL 命名空间 id"

[[kv_namespaces]]
binding = "EMAIL_USER"
id = "你的 EMAIL_USER 命名空间 id"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "attachments"

# 前端资源以文本形式打包进来。
# 注意：一旦自己定义 [[rules]]，wrangler 内置的默认规则就全部失效，
# 所以 .html / .txt 这些原本默认按 Text 处理的也要显式写回来；
# app.js 则是为了覆盖内置的 ESModule 规则（否则它会被当模块执行而不是当字符串导入）。
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt", "**/*.css", "**/app.js"]
fallthrough = false
